<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#004020">
<title>MedWay Clinic — Pontaj & Personal</title>
<style>
:root{
  --green:#004020; --green2:#0a5236; --green3:#0f6a45;
  --accent:#1f8a5b; --line:#d7e4dc; --bg:#f4f8f6; --card:#ffffff;
  --text:#0c2b1e; --muted:#5c766a; --danger:#b3261e; --ok:#1f8a5b; --warn:#b8860b;
  --radius:14px; --shadow:0 2px 10px rgba(0,40,20,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.4}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:15px}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}

/* ---- Login ---- */
.hero{width:100%;max-width:360px;border-radius:18px;display:block;margin:0 auto 4px;box-shadow:0 10px 34px rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.14)}

#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%,#0a5236,#004020 60%); color:#fff; padding:18px}
.logo{font-weight:800;letter-spacing:.04em;font-size:34px;display:flex;align-items:center;gap:2px;user-select:none}
.logo .ecg{color:#eafff3}
.logo small{display:block;text-align:center;font-weight:600;letter-spacing:.42em;font-size:13px;opacity:.9;margin-top:2px}
.loginCard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);
  border-radius:18px;padding:22px;margin-top:26px;width:100%;max-width:380px}
.loginCard h2{margin:0 0 14px;font-size:16px;font-weight:600;opacity:.95}
.who{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow:auto}
.whoBtn{background:#fff;color:var(--green);padding:13px 14px;border-radius:12px;font-weight:600;text-align:left;
  display:flex;justify-content:space-between;align-items:center}
.whoBtn span.role{font-size:12px;color:var(--muted);font-weight:500}
.pinPad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pinPad button{background:rgba(255,255,255,.12);color:#fff;padding:16px;font-size:20px;font-weight:600;border-radius:12px}
.pinPad button.act{background:#fff;color:var(--green)}
.pinDots{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pinDots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}
.pinDots i.on{background:#fff}
.linkBtn{background:none;color:#fff;opacity:.8;text-decoration:underline;margin-top:14px;font-size:13px}

/* ---- App shell ---- */
#app{min-height:100vh;display:flex;flex-direction:column}
header.top{background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;z-index:20}
header.top .brand{font-weight:800;letter-spacing:.03em;font-size:18px;display:flex;align-items:center;gap:2px}
header.top .brand .ecg{color:#bff5d8}
header.top .spacer{flex:1}
header.top .userchip{font-size:13px;background:rgba(255,255,255,.14);padding:6px 10px;border-radius:20px}
header.top button.icon{background:rgba(255,255,255,.14);color:#fff;padding:8px 10px;border-radius:10px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;background:#e9f1ed;padding:8px 10px;position:sticky;top:56px;z-index:19}
nav.tabs button{white-space:nowrap;background:#fff;color:var(--green);padding:9px 14px;border-radius:20px;font-weight:600;border:1px solid var(--line)}
nav.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
main{flex:1;padding:16px;max-width:760px;margin:0 auto;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px;color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--green);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600}
.btn.sec{background:#eaf2ee;color:var(--green)}
.btn.warn{background:var(--warn);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn:disabled{opacity:.5}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input.t,select.t,textarea.t{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.pill.in{background:#e5f6ec;color:var(--ok)}
.pill.out{background:#fbeaea;color:var(--danger)}
.pill.wait{background:#fdf3df;color:var(--warn)}
.pill.ok{background:#e5f6ec;color:var(--ok)}
.muted{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .meta{font-size:12px;color:var(--muted)}
.banner{background:#fdf3df;color:#7a5b00;border:1px solid #eeddb0;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.banner.err{background:#fbeaea;color:#7a1a16;border-color:#efc4c1}
.center{text-align:center}
video,canvas{width:100%;border-radius:12px;background:#000}
.selfieThumb{width:54px;height:54px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.modalWrap{position:fixed;inset:0;background:rgba(0,20,10,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:92vh;overflow:auto}
.tag{font-size:11px;background:#eaf2ee;color:var(--green);padding:2px 7px;border-radius:6px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:16px}
</style>
</head>

  let age=null; try{ const t=new Date(); age=t.getFullYear()-y-((t.getMonth()+1<mm||((t.getMonth()+1===mm)&&t.getDate()<dd))?1:0);}catch(e){}
  return {sex,birth:bd,year:y,age};
}

function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* IndexedDB for pontaj records (and selfies) */
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('medway',1);
    r.onupgradeneeded=e=>{ const db=e.target.result;
      if(!db.objectStoreNames.contains('pontaj')) db.createObjectStore('pontaj',{keyPath:'id'});
    };
    r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e);
  });
}
async function idbPut(store,val){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction(store,'readwrite'); t.objectStore(store).put(val); t.oncomplete=()=>res(); t.onerror=rej; }); }
async function idbAll(store){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction(store,'readonly'); const rq=t.objectStore(store).getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=rej; }); }

const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{ const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; };
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hhmm(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDate(ts){ const d=new Date(ts); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function toast(msg,kind){ const w=el('div','modalWrap'); const m=el('div','modal center'); const p=el('div',kind==='err'?'banner err':'banner'); p.textContent=msg; p.style.marginBottom='14px';
  const b=el('button','btn','OK'); b.onclick=()=>w.remove(); m.appendChild(p); m.appendChild(b); w.appendChild(m); w.onclick=e=>{if(e.target===w)w.remove()}; $('#modalRoot').appendChild(w); }
function distMeters(a,b){ // haversine
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

/* ---- perform a pontaj punch: GPS + selfie + geofence ---- */
function getPosition(){
  return new Promise((res)=>{
    if(!navigator.geolocation){ res({error:'no-geo'}); return; }
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>res({error:e.code===1?'denied':'unavailable'}),
      {enableHighAccuracy:true,timeout:12000,maximumAge:0}
    );
  });
}
async function doPontaj(type){
  // 1. position
  const busy=openModal('Se verifică locația…','<div class="center muted">Te rog acceptă accesul la locație.</div>',[]);
  const pos=await getPosition();
  closeModal(busy);
  let geoOk=null, dist=null;
  if(pos.error){
    if(pos.error==='denied'){ toast('Accesul la locație e blocat. Activează-l din setările telefonului pentru a putea ponta.','err'); return; }
    // unavailable: allow but flag
  } else if(STATE.settings.geofence){
    dist=distMeters(pos,STATE.settings.geofence);
    geoOk = dist <= (STATE.settings.geofence.radius||150);
    if(!geoOk){
      const cont=await confirmModal('În afara clinicii','Ești la ~'+Math.round(dist)+' m de clinică (raza permisă: '+(STATE.settings.geofence.radius||150)+' m). Pontajul va fi marcat „în afara razei" și trimis adminului spre verificare. Continui?');
      if(!cont) return;
    }
  }
  // 2. selfie
  const selfie = await captureSelfie();
  if(selfie===null){ /* user cancelled */ return; }
  // 3. save
  const rec={ id:uid(), empId:SESSION.id, empName:SESSION.name, type, ts:Date.now(),
    lat:pos.lat||null, lng:pos.lng||null, acc:pos.acc||null, dist:dist, geoOk:geoOk,
    selfie:selfie||null, approved:(geoOk===false?false:null), day:todayKey() };
  await idbPut('pontaj',rec);
  fbPush('pontaj',rec);
  toast((type==='IN'?'Intrare':'Ieșire')+' înregistrată la '+hhmm(rec.ts)+(geoOk===false?' (în afara razei — trimis spre verificare)':''));
  renderView();
}

/* ---- selfie capture ---- */
function captureSelfie(){
  return new Promise(async(resolve)=>{
    let stream=null;
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}); }
    catch(e){ toast('Camera nu e disponibilă. Pontajul continuă fără selfie.','err'); resolve(''); return; }
    const w=el('div','modalWrap'); const m=el('div','modal');
    m.appendChild(el('h3',null,'Selfie de confirmare'));
    const video=el('video'); video.autoplay=true; video.playsInline=true; video.muted=true; video.srcObject=stream; m.appendChild(video);
    const row=el('div','row'); row.style.marginTop='12px';
    const snap=el('button','btn big','📸 Fotografiază');
    const cancel=el('button','btn sec','Renunță');
    row.appendChild(snap); m.appendChild(row); m.appendChild(cancel);
    w.appendChild(m); $('#modalRoot').appendChild(w);
    const stop=()=>{ stream.getTracks().forEach(t=>t.stop()); w.remove(); };
    snap.onclick=()=>{
      const cv=document.createElement('canvas');
      const vw=video.videoWidth||640, vh=video.videoHeight||480;
      const scale=Math.min(1,320/vw); cv.width=Math.round(vw*scale); cv.height=Math.round(vh*scale);
      cv.getContext('2d').drawImage(video,0,0,cv.width,cv.height);
      const data=cv.toDataURL('image/jpeg',0.5);
      stop(); resolve(data);
    };
    cancel.onclick=()=>{ stop(); resolve(null); };
  });
}

  c3.appendChild(sp);

  cloud.innerHTML = FB_READY ? '☁ Sincronizare cloud activă.' : '⚠ Mod local (fără cloud). Datele stau doar pe acest dispozitiv până când conectezi Firebase mai jos.';
  c3.appendChild(cloud);
  v.appendChild(c3);

  // ---- Cloud (Firebase) config ----
  const c4=el('div','card'); c4.appendChild(el('h3',null,'Cloud (Firebase) — sincronizare între telefoane'));
  c4.appendChild(el('div','muted','Lipește aici obiectul de configurare din consola Firebase (Project settings → General → „firebaseConfig"). După salvare, aplicația se reîncarcă și datele se sincronizează pe toate dispozitivele.'));
  const ta=el('textarea','t'); ta.id='fb_cfg'; ta.rows=8; ta.style.marginTop='10px'; ta.style.fontFamily='monospace'; ta.style.fontSize='12px';
  ta.placeholder='{\n  "apiKey": "...",\n  "authDomain": "medway-clinic.firebaseapp.com",\n  "databaseURL": "https://medway-clinic-default-rtdb.europe-west1.firebasedatabase.app",\n  "projectId": "medway-clinic",\n  "storageBucket": "medway-clinic.appspot.com",\n  "messagingSenderId": "...",\n  "appId": "..."\n}';
  try{ const cur=localStorage.getItem('mw_fbconfig'); if(cur) ta.value=cur; }catch(e){}
  c4.appendChild(ta);
  const row=el('div','row'); row.style.marginTop='10px';
  const saveCfg=el('button','btn','Salvează și conectează');
  saveCfg.onclick=()=>{
    let raw=$('#fb_cfg').value.trim();
    if(!raw){ toast('Lipește configul mai întâi.','err'); return; }
    // tolerate "const firebaseConfig = {...};" pastes
    const m=raw.match(/\{[\s\S]*\}/); if(m) raw=m[0];
    let cfg; try{ cfg=JSON.parse(raw); }catch(e){
      // try to coerce JS-object style (unquoted keys) to JSON
      try{ cfg=JSON.parse(raw.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,(\s*})/g,'$1')); }
      catch(e2){ toast('Config invalid. Copiază exact obiectul { ... } din Firebase.','err'); return; }
    }
    if(!cfg.databaseURL || !cfg.apiKey){ toast('Lipsește databaseURL sau apiKey din config.','err'); return; }
    localStorage.setItem('mw_fbconfig',JSON.stringify(cfg,null,2));
    toast('Config salvat. Aplicația se reîncarcă…'); setTimeout(()=>location.reload(),900);
  };
  const clr=el('button','btn sec','Șterge configul (mod local)');
  clr.onclick=()=>{ localStorage.removeItem('mw_fbconfig'); toast('Config șters. Reîncarc…'); setTimeout(()=>location.reload(),700); };
  row.appendChild(saveCfg); row.appendChild(clr); c4.appendChild(row);
  const note=el('div','muted'); note.style.marginTop='10px';
  note.innerHTML='Versiune: '+APP_VERSION;
  c4.appendChild(note);
  v.appendChild(c4);
}

/* ========================= DISPONIBILITATE + PROGRAM ========================= */
const DOW=['Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă','Duminică'];
let dispWeek=null;
function mondayOf(d){ d=new Date(d); const g=(d.getDay()+6)%7; d.setDate(d.getDate()-g); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function ddmm(d){ return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'); }
function weekKey(mon){ return todayKey(mon); }
function progFor(dateISO){ const wk=weekKey(mondayOf(dateISO===undefined?new Date():dateISO)); return (STATE.program[wk]&&STATE.program[wk][dateISO])||[]; }

function renderDisponibil(v){
  if(SESSION.role===ROLE_STAFF) return renderDispStaff(v);
  return renderDispAdmin(v);
}

function renderDispStaff(v){
  const my = STATE.disponibil[SESSION.id] || {};
  const c=el('div','card'); c.appendChild(el('h3',null,'Disponibilitatea mea (săptămânal)'));
  c.appendChild(el('div','muted','Bifează zilele în care ești disponibil(ă) și intervalul orar. Adminul folosește asta când face programul.'));
  const wrap=el('div','list'); wrap.style.marginTop='10px';
  DOW.forEach((d,i)=>{
    const cur=my[i]||{on:false,from:'09:00',to:'17:00'};
    const it=el('div','item');
    const left=el('label'); left.style.display='flex'; left.style.alignItems='center'; left.style.gap='8px';
    const cb=el('input'); cb.type='checkbox'; cb.checked=!!cur.on; cb.id='d_on_'+i;
    left.appendChild(cb); left.appendChild(el('b',null,d));
    const right=el('div','row'); right.style.gap='6px';
    const f=el('input','t'); f.type='time'; f.value=cur.from||'09:00'; f.id='d_from_'+i; f.style.width='110px';
    const t=el('input','t'); t.type='time'; t.value=cur.to||'17:00'; t.id='d_to_'+i; t.style.width='110px';
    right.appendChild(f); right.appendChild(t);
    it.appendChild(left); it.appendChild(right); wrap.appendChild(it);
  });
  c.appendChild(wrap);
  const save=el('button','btn'); save.textContent='Salvează disponibilitatea'; save.style.marginTop='12px';
  save.onclick=()=>{ const obj={}; DOW.forEach((d,i)=>{ obj[i]={on:$('#d_on_'+i).checked, from:$('#d_from_'+i).value, to:$('#d_to_'+i).value}; });
    STATE.disponibil[SESSION.id]=obj; saveState(); toast('Disponibilitate salvată.'); };
  c.appendChild(save); v.appendChild(c);

  // my program this week
  const mon=mondayOf(new Date());
  const c2=el('div','card'); c2.appendChild(el('h3',null,'Programul meu — săptămâna '+ddmm(mon)+'–'+ddmm(addDays(mon,6))));
  const list=el('div','list'); let any=false;
  for(let i=0;i<7;i++){ const day=addDays(mon,i); const iso=todayKey(day);
    const mine=progFor(iso).filter(s=>s.empId===SESSION.id);
    mine.forEach(s=>{ any=true; const it=el('div','item');
      it.innerHTML='<div><b>'+DOW[i]+' '+ddmm(day)+'</b><div class="meta">'+s.from+'–'+s.to+(s.note?' · '+s.note:'')+'</div></div>';
      list.appendChild(it); });
  }
  if(!any) list.appendChild(el('div','muted','Nu ai ture programate în această săptămână.'));
  c2.appendChild(list); v.appendChild(c2);
}

function renderDispAdmin(v){
  if(!dispWeek) dispWeek=mondayOf(new Date());
  const mon=dispWeek;
  const nav=el('div','card');
  const top=el('div','row'); top.style.justifyContent='space-between'; top.style.alignItems='center';
  const prev=el('button','btn sec','‹ Săpt. anterioară'); prev.onclick=()=>{ dispWeek=addDays(mon,-7); renderView(); };
  const lbl=el('div'); lbl.innerHTML='<b>Program: '+ddmm(mon)+' – '+ddmm(addDays(mon,6))+'</b>'; lbl.style.textAlign='center';
  const next=el('button','btn sec','Săpt. următoare ›'); next.onclick=()=>{ dispWeek=addDays(mon,7); renderView(); };
  top.appendChild(prev); top.appendChild(lbl); top.appendChild(next); nav.appendChild(top);
  const tcur=el('button','btn'); tcur.textContent='Săptămâna curentă'; tcur.style.marginTop='10px';
  tcur.onclick=()=>{ dispWeek=mondayOf(new Date()); renderView(); }; nav.appendChild(tcur);
  v.appendChild(nav);

  const wk=weekKey(mon); STATE.program[wk]=STATE.program[wk]||{};
  for(let i=0;i<7;i++){
    const day=addDays(mon,i); const iso=todayKey(day);
    const c=el('div','card');
    const hd=el('div','row'); hd.style.justifyContent='space-between'; hd.style.alignItems='center';
    hd.appendChild(el('h3',null,DOW[i]+' · '+ddmm(day)));
    const add=el('button','btn sec','＋ Tură'); add.onclick=()=>dlgShift(iso);
    hd.appendChild(add); c.appendChild(hd);
    const shifts=(STATE.program[wk][iso]||[]).slice().sort((a,b)=>(a.from||'').localeCompare(b.from||''));
    const list=el('div','list');
    if(!shifts.length) list.appendChild(el('div','muted','Nicio tură.'));
    shifts.forEach(s=>{ const emp=STATE.employees.find(e=>e.id===s.empId)||{name:'?'};
      const it=el('div','item');
      it.innerHTML='<div><b>'+emp.name+'</b><div class="meta">'+s.from+'–'+s.to+(s.note?' · '+s.note:'')+'</div></div>';
      const del=el('button','btn danger','✕'); del.style.padding='6px 10px';
      del.onclick=()=>{ STATE.program[wk][iso]=STATE.program[wk][iso].filter(x=>x.id!==s.id); saveState(); renderView(); };
      it.appendChild(del); list.appendChild(it);
    });
    // availability hint
    const avail=STATE.employees.filter(e=>e.active!==false && e.admin!==true && STATE.disponibil[e.id] && STATE.disponibil[e.id][i] && STATE.disponibil[e.id][i].on)
      .map(e=>e.name.split(' ')[0]+' ('+STATE.disponibil[e.id][i].from+'–'+STATE.disponibil[e.id][i].to+')');
    if(avail.length){ const a=el('div','muted'); a.style.marginTop='6px'; a.innerHTML='Disponibili: '+avail.join(', '); c.appendChild(list); c.appendChild(a); }
    else c.appendChild(list);
    v.appendChild(c);
  }
}
function dlgShift(iso){
  const staff=STATE.employees.filter(e=>e.active!==false);
  let opts=staff.map(e=>'<option value="'+e.id+'">'+esc(e.name)+' — '+esc(e.jobTitle||'')+'</option>').join('');
  const body=`<label class="f">Angajat</label><select class="t" id="s_emp">${opts}</select>
    <label class="f">Ture rapide</label>
    <div class="row" style="gap:6px;margin-bottom:4px">
      <button type="button" class="btn sec" style="padding:8px 10px" onclick="document.getElementById('s_from').value='08:00';document.getElementById('s_to').value='16:30'">Tura 1 · 08:00–16:30</button>
      <button type="button" class="btn sec" style="padding:8px 10px" onclick="document.getElementById('s_from').value='11:30';document.getElementById('s_to').value='19:30'">Tura 2 · 11:30–19:30</button>
    </div>
    <div class="grid2"><div><label class="f">De la</label><input class="t" id="s_from" type="time" value="08:00"></div>
    <div><label class="f">Până la</label><input class="t" id="s_to" type="time" value="16:30"></div></div>
    <label class="f">Notă (opțional)</label><input class="t" id="s_note" placeholder="ex. cabinet 2, gardă">`;
  openModal('Adaugă tură — '+iso.split('-').reverse().join('.'), body, [
    {label:'Adaugă',cls:'btn',fn:()=>{
      const wk=weekKey(mondayOf(iso)); STATE.program[wk]=STATE.program[wk]||{}; STATE.program[wk][iso]=STATE.program[wk][iso]||[];
      STATE.program[wk][iso].push({id:uid(),empId:$('#s_emp').value,from:$('#s_from').value,to:$('#s_to').value,note:$('#s_note').value.trim()});
      saveState(); renderView();
    }},
    {label:'Închide',cls:'btn sec',fn:()=>true}
  ]);
}

function openDocWindow(title, inner, filename){
  const w=window.open('','_blank');
  if(!w){ toast('Permite ferestrele pop-up ca să vezi documentul.','err'); return; }
  const docHtml='<div class="doc">'+inner+'</div>';
  w.document.write('<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><title>'+title+'</title><style>'+DOC_CSS+'</style></head><body>'+
    '<div class="toolbar"><button onclick="window.print()">🖨️ Printează / PDF</button>'+
    '<button onclick="dl()">⬇️ Descarcă Word</button></div>'+docHtml+
    '<script>function dl(){var h=document.querySelector(\'.doc\').outerHTML;'+
    'var head=\'<html xmlns:o=\\\'urn:schemas-microsoft-com:office:office\\\' xmlns:w=\\\'urn:schemas-microsoft-com:office:word\\\' xmlns=\\\'http://www.w3.org/TR/REC-html40\\\'><head><meta charset=utf-8><style>'+DOC_CSS.replace(/'/g,"\\'").replace(/\n/g,' ')+'</style></head><body>\';'+
    'var blob=new Blob([\'\\ufeff\',head,h,\'</body></html>\'],{type:\'application/msword\'});'+
    'var a=document.createElement(\'a\');a.href=URL.createObjectURL(blob);a.download=\''+(filename||'document')+'.doc\';a.click();}<\/script>'+
    '</body></html>');
  w.document.close();
}
function co(){ return (STATE.settings&&STATE.settings.company)||COMPANY; }
function normaText(hr){
  if(hr.norma==='parțial'){ const o=hr.oreZi||4; return 'timp parțial, '+o+' ore/zi ('+(o*5)+' ore/săptămână)'; }
  return 'normă întreagă, 8 ore/zi (40 ore/săptămână)';
}
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  const ta=el('textarea','t'); ta.id='hr_paste'; ta.rows=4; ta.placeholder='…sau lipește aici conținutul JSON'; ta.style.fontFamily='monospace'; ta.style.fontSize='12px';

    catch(e){ toast('JSON invalid.','err'); } };
  const exp=el('button','btn sec','Exportă (backup)');

function genROI(){
  const C=co();
  const H=t=>'<h2>'+t+'</h2>';
  const A=(l,t)=>'<p><span class="art">'+l+'</span> '+t+'</p>';
  const UL=items=>'<ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  let x = docHeader('REGULAMENT INTERN','al societății '+esc(C.name)+' — unitate medicală (clinică)');
  x += '<p style="text-align:center" class="muted">Aprobat de administrator la data de ____________ · Ediția 1</p>';
  x += A('Temei legal.','Prezentul Regulament intern este întocmit în temeiul art. 241–246 din Legea nr. 53/2003 — Codul muncii, republicată, precum și al Legii nr. 319/2006 (securitate și sănătate în muncă), Legii nr. 202/2002 (egalitate de șanse), O.G. nr. 137/2000 (nediscriminare), Regulamentului (UE) 2016/679 — GDPR, Legii nr. 95/2006 (reforma în sănătate) și Ordinului M.S. nr. 1.101/2016 (prevenirea infecțiilor asociate asistenței medicale — IAAM).');

  x += H('Capitolul I. Dispoziții generale');
  x += A('Art. 1.','Regulamentul stabilește regulile de conduită, drepturile și obligațiile angajatorului și ale salariaților, disciplina muncii, răspunderea disciplinară, precum și regulile specifice activității medicale desfășurate în cadrul clinicii.');
  x += A('Art. 2.','Prevederile se aplică <b>tuturor salariaților</b> '+esc(C.name)+' (denumită „Angajatorul" sau „Clinica"), indiferent de durata contractului, felul muncii, funcție sau forma de organizare a timpului de lucru (normă întreagă, timp parțial, telemuncă), precum și persoanelor detașate, elevilor/studenților în practică și colaboratorilor.');
  x += A('Art. 3.','Necunoașterea prevederilor Regulamentului nu exonerează salariatul de răspundere. Regulamentul se completează de drept cu dispozițiile legale în vigoare și cu clauzele contractelor individuale de muncă.');

  x += H('Capitolul II. Drepturile și obligațiile Angajatorului');
  x += A('Art. 4.','Angajatorul are dreptul, în principal: să stabilească organizarea și funcționarea clinicii; să stabilească atribuțiile prin fișa postului; să dea dispoziții cu caracter obligatoriu, sub rezerva legalității; să controleze modul de îndeplinire a sarcinilor; să constate abaterile și să aplice sancțiunile.');
  x += A('Art. 5.','Angajatorul are obligația, în principal: să asigure condiții de muncă și de securitate și sănătate, inclusiv de prevenire a infecțiilor; să achite drepturile salariale la termen; să elibereze, la cerere, documente care atestă calitatea de salariat; să asigure confidențialitatea datelor personale ale salariaților; să informeze salariații asupra condițiilor de muncă.');

  x += H('Capitolul III. Drepturile și obligațiile salariaților');
  x += A('Art. 6.','Salariatul are dreptul, în principal: la salarizare; la repaus zilnic și săptămânal și la concediu de odihnă; la securitate și sănătate în muncă; la formare profesională; la demnitate și la protecția datelor personale; la egalitate de tratament și nediscriminare.');
  x += A('Art. 7.','Salariatul are obligația, în principal: să realizeze atribuțiile din fișa postului; să respecte programul și să efectueze pontajul; să respecte disciplina muncii și dispozițiile legale; să respecte măsurile de securitate și sănătate; <b>să păstreze secretul profesional și confidențialitatea datelor pacienților</b>; să păstreze bunurile clinicii; să aibă un comportament civilizat față de pacienți și colegi.');
  x += A('Art. 8. (specific medical).','Personalul medical și auxiliar are, suplimentar, obligația: să exercite profesia cu respectarea normelor deontologice; să respecte drepturile pacientului (Legea nr. 46/2003, Legea nr. 95/2006); să respecte procedurile de prevenire și control al infecțiilor (IAAM); să completeze corect documentația medicală; să nu divulge informații despre starea de sănătate a pacienților decât în condițiile legii.');

  x += H('Capitolul IV. Securitatea și sănătatea în muncă');
  x += A('Art. 9.','Salariații respectă normele de securitate și sănătate în muncă (Legea nr. 319/2006), instrucțiunile proprii și normele PSI. Este obligatorie participarea la instructaje și la controalele de medicina muncii.');
  x += A('Art. 10.','Salariații: utilizează corect echipamentul de protecție; nu deconectează dispozitivele de securitate; anunță imediat orice defecțiune, accident sau pericol; nu se prezintă la lucru sub influența alcoolului sau a substanțelor interzise.');

  x += H('Capitolul V. Prevenirea și controlul infecțiilor (IAAM)');
  x += A('Art. 11.','Respectarea măsurilor de prevenire și limitare a infecțiilor asociate asistenței medicale este <b>obligație pentru întreg personalul</b> (Ordinul M.S. nr. 1.101/2016). Nerespectarea constituie abatere disciplinară gravă.');
  x += A('Art. 12.','Personalul: respectă protocoalele de igienă a mâinilor și de utilizare a echipamentului de protecție; respectă procedurile de curățenie, dezinfecție și sterilizare; gestionează deșeurile medicale periculoase conform reglementărilor; raportează orice suspiciune de infecție asociată asistenței medicale.');

  x += H('Capitolul VI. Nediscriminarea și respectarea demnității');
  x += A('Art. 13.','Sunt interzise orice fapte de discriminare directă sau indirectă pe criterii de sex, orientare sexuală, vârstă, apartenență națională, rasă, religie, opinie politică, origine socială, handicap sau situație familială.');
  x += A('Art. 14.','Sunt interzise hărțuirea, inclusiv cea sexuală, și hărțuirea morală (mobbing), precum și orice comportament care aduce atingere demnității. Victimele pot sesiza Angajatorul, care are obligația să analizeze și să soluționeze sesizarea.');

  x += H('Capitolul VII. Secretul profesional și protecția datelor pacienților');
  x += A('Art. 15.','Datele privind starea de sănătate sunt <b>date sensibile</b> (art. 9 GDPR) și sunt protejate prin secretul profesional. Salariații păstrează confidențialitatea atât pe durata contractului, cât și după încetarea acestuia.');
  x += A('Art. 16.','Este interzisă: consultarea datelor pacienților în afara scopului profesional; divulgarea, copierea, fotografierea sau transmiterea neautorizată; comunicarea către terți fără temei legal. Încălcarea este abatere disciplinară gravă și poate atrage răspundere civilă, contravențională sau penală.');
  x += A('Art. 17.','Prelucrarea datelor se face numai în scopurile și cu măsurile tehnice și organizatorice stabilite de Angajator, conform GDPR.');

  x += H('Capitolul VIII. Timpul de muncă și de odihnă');
  x += A('Art. 18.','Durata timpului de muncă este cea din contractul individual (normă întreagă sau timp parțial). Programul și repartizarea turelor se stabilesc prin programarea internă, comunicată salariaților.');
  x += A('Art. 19.','Prezența se consemnează prin <b>aplicația internă de pontaj</b>. Salariatul pontează sosirea și plecarea. Falsificarea pontajului este abatere disciplinară gravă.');
  x += A('Art. 20.','Salariații beneficiază de pauze, de repaus zilnic și săptămânal și de concediu de odihnă anual de minimum 21 de zile lucrătoare (proporțional la timp parțial), precum și de celelalte concedii legale. Cererile de concediu se depun în avans și se aprobă de administrator, în funcție de continuitatea actului medical.');

  x += H('Capitolul IX. Salarizarea');
  x += A('Art. 21.','Salariul este confidențial. Plata se face lunar, prin virament. Reținerile se efectuează numai în condițiile legii. <b>Aplicarea de amenzi disciplinare este interzisă.</b>');

  x += H('Capitolul X. Reguli concrete de disciplină a muncii');
  x += A('Art. 22.','Salariații: respectă programul și pontajul; poartă ținuta și echipamentul corespunzătoare; au o conduită profesională și respectuoasă; nu consumă și nu se află sub influența alcoolului sau a substanțelor interzise în program; respectă interdicția fumatului în clinică; nu folosesc bunurile clinicii în interes personal; evită conflictul de interese.');

  x += H('Capitolul XI. Abaterile disciplinare');
  x += A('Art. 23.','Constituie abatere disciplinară orice faptă în legătură cu munca, săvârșită cu vinovăție, prin care salariatul a încălcat normele legale, prezentul Regulament, contractul individual de muncă ori dispozițiile legale ale conducerii.');
  x += A('Art. 24. (enumerare exemplificativă).','Constituie abateri disciplinare, între altele:')+UL([
    'întârzierea repetată, absența nemotivată sau părăsirea locului de muncă fără aprobare;',
    'falsificarea pontajului sau a documentelor clinicii;',
    'divulgarea datelor pacienților ori încălcarea secretului profesional (abatere gravă);',
    'nerespectarea normelor IAAM (abatere gravă);',
    'neglijența în îndeplinirea atribuțiilor medicale sau administrative;',
    'prezentarea la lucru sub influența alcoolului sau a substanțelor interzise;',
    'comportamentul necuviincios, hărțuirea sau discriminarea;',
    'însușirea, degradarea sau folosirea în interes personal a bunurilor clinicii.'
  ]);

  x += H('Capitolul XII. Sancțiunile disciplinare');
  x += A('Art. 25.','Sancțiunile disciplinare (art. 248 Codul muncii) sunt: <b>a)</b> avertismentul scris; <b>b)</b> retrogradarea din funcție, cu salariul corespunzător, pe cel mult 60 de zile; <b>c)</b> reducerea salariului de bază pe 1–3 luni cu 5–10%; <b>d)</b> reducerea salariului de bază și/sau a indemnizației de conducere pe 1–3 luni cu 5–10%; <b>e)</b> desfacerea disciplinară a contractului individual de muncă.');
  x += A('Art. 26.','Amenzile disciplinare sunt interzise. Pentru aceeași abatere se aplică o singură sancțiune, individualizată în raport cu gravitatea faptei, gradul de vinovăție și comportarea generală a salariatului.');

  x += A('Art. 30.','Sancțiunea se dispune prin <b>decizie scrisă, în 30 de zile calendaristice</b> de la luarea la cunoștință, dar nu mai târziu de 6 luni de la săvârșirea faptei (art. 252), cu elementele obligatorii prevăzute de lege.');

  x += A('Art. 32.','Cererile și reclamațiile individuale se adresează, în scris, administratorului și se soluționează motivat în <b>30 de zile</b> de la înregistrare. Salariatul nemulțumit se poate adresa instanțelor competente.');

  x += H('Capitolul XVI. Preavizul');
  x += A('Art. 35.','Termenele de preaviz, la demisie sau concediere, sunt cele din Codul muncii și din contractul individual. Salariatul care demisionează respectă preavizul și predă lucrările și bunurile din gestiune.');

  x += A('Art. 38.','Orice modificare se comunică în aceleași condiții. Regulamentul se completează cu prevederile legale în vigoare și cu fișele de post, anexă la contractele individuale de muncă.');

  x += '<div class="sig"><div><b>MEDWAY CLINIC S.R.L.</b><br>Administrator: '+esc(C.admin)+'<br><br>_______________________</div><div class="muted">Data: ____________</div></div>';
  openDocWindow('ROI — '+C.name, x, 'ROI_MedWay_Clinic');

/* ========================= MODAL ========================= */
function openModal(title,html,actions){
  const w=el('div','modalWrap'); const m=el('div','modal');
  m.appendChild(el('h3',null,title));
  const body=el('div'); body.innerHTML=html; m.appendChild(body);
  const row=el('div','row'); row.style.marginTop='14px';
  (actions||[]).forEach(a=>{ const b=el('button',a.cls,a.label); b.onclick=()=>{ const r=a.fn(); if(r!==false) w.remove(); }; row.appendChild(b); });
  m.appendChild(row); w.appendChild(m); $('#modalRoot').appendChild(w);
  w.onclick=e=>{ if(e.target===w && (!actions||!actions.length)) w.remove(); };
  return w;
}
function closeModal(w){ if(w&&w.remove) w.remove(); }
function confirmModal(title,msg){
  return new Promise(res=>{
    const w=el('div','modalWrap'); const m=el('div','modal');
    m.appendChild(el('h3',null,title)); m.appendChild(el('div','muted',msg));
    const row=el('div','row'); row.style.marginTop='14px';
    const yes=el('button','btn','Continuă'); yes.onclick=()=>{ w.remove(); res(true); };
    const no=el('button','btn sec','Anulează'); no.onclick=()=>{ w.remove(); res(false); };
    row.appendChild(yes); row.appendChild(no); m.appendChild(row); w.appendChild(m); $('#modalRoot').appendChild(w);
  });
}

/* ========================= BOOT ========================= */
function boot(){
  loadState();
  if(FB_READY){ fbInit();
    if(FB){ FB.ref(NS+'config/state').once('value').then(s=>{ const val=s.val(); if(val){ STATE=Object.assign(STATE,val); lsSet('mw_state',STATE);} renderLogin(); }).catch(()=>renderLogin()); }
    else renderLogin();
  } else renderLogin();
}
if(FB_READY){
  const s1=document.createElement('script'); s1.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  const s2=document.createElement('script'); s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
  s1.onload=()=>document.body.appendChild(s2); s2.onload=boot; document.body.appendChild(s1);
} else { boot(); }
</script>
